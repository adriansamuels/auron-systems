<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auron Systems — v3 Core</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Arial;background:#f7f7f5;margin:0;color:#111}
header{padding:14px 20px;border-bottom:1px solid #e5e5e3;background:#fff;position:sticky;top:0}
.container{max-width:1200px;margin:auto;padding:20px}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:#fff;border:1px solid #e5e5e3;border-radius:12px;padding:14px}
button{cursor:pointer}

.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input,select,textarea{width:100%;padding:8px;border:1px solid #ddd;border-radius:8px}

.pipeline{display:flex;gap:10px;overflow-x:auto}
.col{min-width:220px;background:#fff;border:1px solid #e5e5e3;border-radius:10px;padding:10px}
.lead{border:1px solid #eee;border-radius:8px;padding:8px;margin:6px 0;cursor:pointer}

.badge{font-size:11px;padding:2px 8px;border-radius:20px;background:#eee}
</style>
</head>

<body>

<header>
<strong>Auron Systems v3</strong>
</header>

<div class="container">

<div class="grid">

<!-- LEAD FORM -->
<div class="card">
<h3>New Lead</h3>

<input id="name" placeholder="Name">
<input id="business" placeholder="Business">
<input id="email" placeholder="Email">
<input id="value" placeholder="Estimated Value">

<select id="stage">
<option value="0">New Lead</option>
<option value="1">Contacted</option>
<option value="2">Call Booked</option>
<option value="3">Proposal</option>
<option value="4">Won</option>
</select>

<button onclick="createLead()">Save Lead</button>
</div>

<!-- METRICS -->
<div class="card">
<h3>Metrics</h3>
<div id="metrics">Loading...</div>
</div>

</div>

<!-- PIPELINE -->
<h3 style="margin-top:20px">Pipeline</h3>
<div class="pipeline" id="pipeline"></div>

</div>

<script>

/* =========================
   SUPABASE LAYER (isolated)
========================= */

const supabase = window.supabase.createClient(
  "https://glzorptkitwpafpzznjg.supabase.co",
  "YOUR_ANON_KEY"
);

const DB = {
  leads: () => supabase.from("leads"),
  clients: () => supabase.from("clients"),
  bookings: () => supabase.from("bookings")
};

/* =========================
   APP STATE
========================= */

let state = {
  leads: []
};

const STAGES = [
  "New Lead",
  "Contacted",
  "Call Booked",
  "Proposal",
  "Won"
];

/* =========================
   EVENT SYSTEM (AURON CORE)
========================= */

async function trigger(event, payload) {
  if (event === "lead_created") {
    console.log("Lead created event", payload);
  }

  if (event === "lead_stage_changed") {
    if (payload.stage === 4) {
      await autoCreateClient(payload);
    }
  }
}

/* =========================
   DATA OPERATIONS
========================= */

async function loadLeads() {
  const { data, error } = await DB.leads().select("*");
  if (error) return console.error(error);

  state.leads = data;
  render();
}

async function createLead() {
  const lead = {
    name: document.getElementById("name").value,
    business: document.getElementById("business").value,
    email: document.getElementById("email").value,
    estimated_value: document.getElementById("value").value,
    stage: parseInt(document.getElementById("stage").value)
  };

  const { data, error } = await DB.leads().insert([lead]).select();
  if (error) return alert(error.message);

  state.leads.unshift(data[0]);

  await trigger("lead_created", data[0]);
  render();
}

/* =========================
   AUTOMATION LAYER
========================= */

async function autoCreateClient(lead) {
  await DB.clients().insert([{
    name: lead.name,
    business: lead.business,
    email: lead.email,
    value: lead.estimated_value
  }]);
}

/* =========================
   PIPELINE LOGIC
========================= */

async function moveLead(id, newStage) {
  const lead = state.leads.find(l => l.id === id);
  if (!lead) return;

  const oldStage = lead.stage;
  lead.stage = newStage;

  await DB.leads().update({ stage: newStage }).eq("id", id);

  if (oldStage !== newStage) {
    await trigger("lead_stage_changed", lead);
  }

  render();
}

/* =========================
   UI RENDER
========================= */

function render() {
  renderPipeline();
  renderMetrics();
}

function renderPipeline() {
  const el = document.getElementById("pipeline");
  el.innerHTML = "";

  STAGES.forEach((s, i) => {
    const col = document.createElement("div");
    col.className = "col";

    const leads = state.leads.filter(l => l.stage === i);

    col.innerHTML = `
      <h4>${s} <span class="badge">${leads.length}</span></h4>
      ${leads.map(l => `
        <div class="lead">
          <strong>${l.name}</strong><br>
          <small>${l.business}</small><br>
          <small>$${l.estimated_value || 0}</small>
          <div class="row">
            ${i > 0 ? `<button onclick="moveLead('${l.id}',${i-1})">←</button>` : ""}
            ${i < STAGES.length-1 ? `<button onclick="moveLead('${l.id}',${i+1})">→</button>` : ""}
          </div>
        </div>
      `).join("")}
    `;

    el.appendChild(col);
  });
}

function renderMetrics() {
  const total = state.leads.length;
  const won = state.leads.filter(l => l.stage === 4).length;

  document.getElementById("metrics").innerHTML = `
    <div>Total Leads: ${total}</div>
    <div>Won: ${won}</div>
  `;
}

/* =========================
   INIT
========================= */

loadLeads();

</script>

</body>
</html>
